[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/privacy"
  to = "/privacy/"
  status = 301

[[redirects]]
  from = "/support"
  to = "/support/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
